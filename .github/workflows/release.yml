name: Release automatisch anlegen

# Sobald die Version in manifest.json erhöht wird, legt GitHub selbst ein
# Release an (z. B. v1.1.5). HACS zeigt dann diese Versionsnummer an.
# Erst NACHDEM „Prüfen“ (HACS, hassfest, Tests) grün durchgelaufen ist –
# so will es HACS für die Aufnahme in die offizielle Liste.
on:
  workflow_run:
    workflows: ["Prüfen"]
    types: [completed]
    branches: [main, beta]   # 🧪 „beta“ = Testversionen (Vorabversion, nur für HACS „Beta-Versionen anzeigen“)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.SHA }}

      - name: Version auslesen
        id: version
        run: echo "tag=v$(jq -r .version custom_components/fixkosten/manifest.json)" >> "$GITHUB_OUTPUT"

      # 📦 Fertig gepackte ZIP für HACS (hacs.json: zip_release + filename).
      # Darin liegt direkt der Inhalt von custom_components/fixkosten/ (manifest.json ganz oben) –
      # HACS packt die ZIP genau so nach config/custom_components/fixkosten/ aus.
      # Jeder HACS-Download dieser Datei zählt bei GitHub mit → Download-Schild im README.
      # 📥 Download-Zahl für die Credits: Summe aller ZIP-Downloads aller Releases (Stand jetzt).
      # Die Datei kommt NUR in die ZIP (nicht ins Repo). Die Karte liest sie offline –
      # kein Live-Aufruf an GitHub beim Nutzer. Klappt die Abfrage nicht, gibt es einfach keine Datei.
      - name: Download-Zahl in die ZIP legen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
                -q '.[].assets[] | select(.name | endswith(".zip")) | .download_count' 2>/dev/null \
              | awk '{s+=$1} END {print s+0}') || N=""
          if [ -n "$N" ]; then
            printf '{"downloads": %s, "stand": "%s"}\n' "$N" "$(date -u +%F)" > custom_components/fixkosten/www/downloads.json
            cat custom_components/fixkosten/www/downloads.json
          else
            echo "Download-Zahl nicht abrufbar – Credits zeigen dann einfach keine Zeile."
          fi

      - name: ZIP für HACS packen
        run: |
          cd custom_components/fixkosten
          zip -r -X -q ../../fixkosten.zip . -x '*__pycache__*' '*.pyc'
          cd ../..
          unzip -l fixkosten.zip | grep -q ' manifest.json$' || { echo "manifest.json fehlt in der ZIP"; exit 1; }

      - name: Release anlegen (nur wenn es die Version noch nicht gibt)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          # 🧪 Sicherung: Auf „beta“ nur Versionen mit -beta, auf „main“ nie eine -beta
          PRE=""
          case "$TAG" in *-beta*) PRE="--prerelease";; esac
          if [ "$BRANCH" = "beta" ] && [ -z "$PRE" ]; then echo "Auf beta nur -beta-Versionen – nichts zu tun."; exit 0; fi
          if [ "$BRANCH" != "beta" ] && [ -n "$PRE" ]; then echo "-beta gehört auf den Zweig beta – nichts zu tun."; exit 0; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 📦 Release gibt es schon, aber ohne ZIP? Dann nachreichen (sonst fände HACS die Datei nicht)
            if gh release view "$TAG" --json assets -q '.assets[].name' | grep -qxF fixkosten.zip; then
              echo "Release $TAG gibt es schon (mit ZIP) – nichts zu tun."
            else
              gh release upload "$TAG" fixkosten.zip && echo "📦 ZIP an $TAG nachgereicht."
            fi
          else
            # 📝 Kurze deutsche Beschreibung: die Commit-Texte seit dem letzten Release
            PREV=$(git describe --tags --abbrev=0 --exclude '*-beta*' "$SHA^" 2>/dev/null || true)
            RANGE=${PREV:+$PREV..}$SHA
            {
              echo "## Was ist neu"
              git log "$RANGE" --no-merges --pretty=format:'- %s'
              echo
              [ -n "$PREV" ] && echo "**Alle Änderungen:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            } > notes.md
            if ! grep -q "^- " notes.md; then
              gh release create "$TAG" --target "$SHA" --title "$TAG" $PRE --generate-notes fixkosten.zip
            else
              gh release create "$TAG" --target "$SHA" --title "$TAG" $PRE --notes-file notes.md fixkosten.zip
            fi
          fi
