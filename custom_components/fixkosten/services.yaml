abhaken:
  fields:
    name:
      required: true
      example: "Miete"
      selector:
        text:
    erledigt:
      default: true
      selector:
        boolean:
kontostand_setzen:
  fields:
    kontostand:
      required: true
      example: 1234.56
      selector:
        number:
          min: -100000
          max: 10000000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
buchung_hinzufuegen:
  fields:
    name:
      example: "Bäckerei"
      selector:
        text:
    betrag:
      required: true
      example: 5.75
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
topf_setzen:
  fields:
    name:
      required: true
      example: "Sparkonto"
      selector:
        text:
    betrag:
      required: true
      selector:
        number:
          min: -10000000
          max: 10000000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
haken_zuruecksetzen:
csv_import:
  fields:
    text:
      selector:
        text:
          multiline: true
    datei:
      example: "fixkosten.csv"
